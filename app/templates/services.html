{% extends "base.html" %}
{% block title %}Servicios{% endblock %}
{% block heading %}Servicios systemd{% endblock %}

{% block content %}
<div class="toolbar">
  <input type="text" id="filter" placeholder="Buscar servicio…" class="input">
  <button class="btn" onclick="loadServices()">Refrescar</button>
</div>

<div class="card">
  <table class="lx" id="svc-table">
    <thead>
      <tr><th>Unidad</th><th>Estado</th><th>Sub</th><th>Arranque</th><th>Descripción</th><th>Acciones</th></tr>
    </thead>
    <tbody><tr><td colspan="6" class="muted center">Cargando…</td></tr></tbody>
  </table>
</div>

<div id="status-modal" class="modal">
  <div class="modal-box wide">
    <h3 id="status-title" class="mono"></h3>
    <pre class="terminal output" id="status-out"></pre>
    <div class="form-actions"><button class="btn" onclick="document.getElementById('status-modal').classList.remove('open')">Cerrar</button></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allSvcs = [];

async function loadServices() {
  const r = await fetch("{{ url_for('services.list_services') }}");
  const d = await r.json();
  if (d.error) {
    document.querySelector('#svc-table tbody').innerHTML =
      '<tr><td colspan="6" class="muted center">Error: ' + escapeHtml(d.error) + '</td></tr>';
    return;
  }
  allSvcs = d.services;
  render();
}

function render() {
  const q = document.getElementById('filter').value.toLowerCase();
  const filtered = allSvcs.filter(s => !q || s.unit.toLowerCase().includes(q) || s.description.toLowerCase().includes(q));
  const tbody = document.querySelector('#svc-table tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted center">Sin resultados</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(s => {
    const cls = s.active === 'active' ? 'ok' : s.active === 'failed' ? 'err' : 'mute';
    return `
      <tr>
        <td class="mono">${escapeHtml(s.unit)}</td>
        <td><span class="pill ${cls}">${escapeHtml(s.active)}</span></td>
        <td class="mono">${escapeHtml(s.sub)}</td>
        <td><span class="pill ${s.enabled === 'enabled' ? 'ok' : 'mute'}">${escapeHtml(s.enabled || '—')}</span></td>
        <td>${escapeHtml(s.description)}</td>
        <td>
          <button class="btn btn-sm" title="Iniciar" onclick="action(${jsArg(s.unit)}, 'start')">▶</button>
          <button class="btn btn-sm" title="Detener" onclick="action(${jsArg(s.unit)}, 'stop')">■</button>
          <button class="btn btn-sm" title="Reiniciar" onclick="action(${jsArg(s.unit)}, 'restart')">↻</button>
          ${s.enabled === 'enabled'
            ? `<button class="btn btn-sm" onclick="action(${jsArg(s.unit)}, 'disable')" title="No iniciar al arrancar">⏻ off</button>`
            : s.enabled === 'disabled'
              ? `<button class="btn btn-sm" onclick="action(${jsArg(s.unit)}, 'enable')" title="Iniciar al arrancar">⏻ on</button>` : ''}
          <button class="btn btn-sm" onclick="showStatus(${jsArg(s.unit)})">estado</button>
        </td>
      </tr>`;
  }).join('');
}

const ACTION_TEXT = {
  start:   ['Iniciar', '¿Iniciar el servicio {u}?'],
  stop:    ['Detener', '¿Detener el servicio {u}? Dejará de funcionar hasta que lo inicies de nuevo.'],
  restart: ['Reiniciar', '¿Reiniciar el servicio {u}? Se cortará unos segundos.'],
  enable:  ['Habilitar al arranque', '¿Habilitar {u} al arranque? Se iniciará solo cada vez que arranque el servidor.'],
  disable: ['Deshabilitar al arranque', '¿Deshabilitar {u} al arranque? No se iniciará solo la próxima vez que arranque el servidor.'],
};

async function action(unit, act) {
  const [verb, text] = ACTION_TEXT[act] || [act, '¿Ejecutar ' + act + ' en {u}?'];
  if (!await ui.confirm(text.replace('{u}', unit),
      { title: verb + ' · ' + unit, danger: ['stop', 'restart', 'disable'].includes(act), confirmText: verb })) return;
  const d = await postJSON("{{ url_for('services.action') }}", { unit, action: act });
  if (!d.ok) ui.alert(d.error, { title: 'Error', icon: 'error' });
  setTimeout(loadServices, 600);
}

async function showStatus(unit) {
  document.getElementById('status-title').textContent = unit;
  document.getElementById('status-out').textContent = 'Cargando…';
  document.getElementById('status-modal').classList.add('open');
  const d = await (await fetch("{{ url_for('services.status') }}?unit=" + encodeURIComponent(unit))).json();
  document.getElementById('status-out').textContent = d.error || d.output;
}


document.getElementById('filter').addEventListener('input', render);
loadServices();
</script>
{% endblock %}
