{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block heading %}Logs del sistema{% endblock %}

{% block content %}
<div class="toolbar">
  <select id="source" class="input" onchange="toggleSource()">
    <option value="">journalctl</option>
  </select>
  <input type="text" id="unit" class="input" placeholder="Unidad (ej: ssh.service)" style="width:240px;">
  <select id="priority" class="input">
    <option value="">Todas las prioridades</option>
    <option value="err">err</option>
    <option value="warning">warning</option>
    <option value="info">info</option>
  </select>
  <select id="n" class="input">
    <option value="100">100 líneas</option>
    <option value="200" selected>200</option>
    <option value="500">500</option>
    <option value="1000">1000</option>
    <option value="5000">5000 (archivos)</option>
  </select>
  <button class="btn" onclick="load()">Cargar</button>
</div>

<pre id="log-output" class="terminal">Selecciona filtros y pulsa "Cargar"…</pre>
{% endblock %}

{% block scripts %}
<script>
function toggleSource() {
  const isFile = !!document.getElementById('source').value;
  document.getElementById('unit').style.display = isFile ? 'none' : '';
  document.getElementById('priority').style.display = isFile ? 'none' : '';
  load();
}

async function loadFiles() {
  const d = await (await fetch("{{ url_for('logs.files') }}")).json();
  const sel = document.getElementById('source');
  for (const f of d.files || []) {
    const o = document.createElement('option');
    o.value = f.path; o.textContent = f.path;
    sel.appendChild(o);
  }
}

async function load() {
  const source = document.getElementById('source').value;
  const unit = document.getElementById('unit').value;
  const priority = document.getElementById('priority').value;
  const n = document.getElementById('n').value;
  const out = document.getElementById('log-output');
  out.textContent = 'Cargando…';
  const params = new URLSearchParams({ n });
  let url = "{{ url_for('logs.recent') }}";
  if (source) { url = "{{ url_for('logs.file_tail') }}"; params.set('path', source); }
  if (unit) params.set('unit', unit);
  if (priority) params.set('priority', priority);
  const r = await fetch(url + "?" + params.toString());
  const d = await r.json();
  if (d.error) { out.textContent = d.error; return; }
  out.textContent = d.lines.join('\n');
  out.scrollTop = out.scrollHeight;
}
loadFiles();
load();
</script>
{% endblock %}
