{% extends "base.html" %}
{% block title %}Procesos{% endblock %}
{% block heading %}Procesos{% endblock %}

{% block content %}
<div class="toolbar">
  <input type="text" id="filter" placeholder="Filtrar por nombre, usuario o PID…" class="input">
  <button class="btn" onclick="loadProcesses()">Refrescar</button>
</div>

<div class="card">
  <table class="lx" id="proc-table">
    <thead>
      <tr><th>PID</th><th>Usuario</th><th>CMD</th><th>CPU%</th><th>MEM%</th><th>Estado</th><th>Tiempo</th><th></th></tr>
    </thead>
    <tbody><tr><td colspan="8" class="muted center">Cargando procesos…</td></tr></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
let allProcs = [];
const KILL_URL = "{{ url_for('processes.kill', pid=999999999) }}";

async function loadProcesses() {
  const r = await fetch("{{ url_for('processes.list_processes') }}");
  const d = await r.json();
  allProcs = d.processes;
  render();
}

function render() {
  const q = document.getElementById('filter').value.toLowerCase();
  const filtered = allProcs.filter(p =>
    !q || p.cmd.toLowerCase().includes(q) || p.user.toLowerCase().includes(q) || String(p.pid).includes(q)
  );
  const tbody = document.querySelector('#proc-table tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="muted center">Sin resultados</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(p => `
    <tr>
      <td class="mono">${escapeHtml(p.pid)}</td>
      <td>${escapeHtml(p.user)}</td>
      <td class="mono truncate" title="${escapeHtml(p.cmd)}">${escapeHtml(p.cmd)}</td>
      <td>${escapeHtml(p.cpu)}</td>
      <td>${escapeHtml(p.mem)}</td>
      <td><span class="pill mute">${escapeHtml(p.status)}</span></td>
      <td class="mono">${escapeHtml(p.running)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="killProc(${jsArg(p.pid)}, ${jsArg(p.cmd)})">Kill</button></td>
    </tr>
  `).join('');
}

async function killProc(pid, cmd) {
  const v = await ui.form({
    title: 'Terminar proceso ' + pid, danger: true, confirmText: 'Terminar',
    text: '¿Enviar SIGTERM al proceso ' + pid + '? Se le pide que cierre de forma ordenada.\n\n' + (cmd || ''),
    fields: [{ name: 'force', type: 'checkbox', label: 'Forzar (SIGKILL)',
               help: 'Lo mata al instante, sin dejarle guardar ni cerrar nada. Úsalo si no responde a SIGTERM.' }],
  });
  if (!v) return;
  const url = KILL_URL.replace('999999999', encodeURIComponent(pid)) + (v.force ? '?force=1' : '');
  const r = await fetch(url, { method: 'POST' });
  const d = await r.json();
  if (!d.ok) ui.alert(d.error, { title: 'No se pudo terminar el proceso', icon: 'error' });
  setTimeout(loadProcesses, 500);
}

document.getElementById('filter').addEventListener('input', render);
loadProcesses();
</script>
{% endblock %}
